<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quick Bite - Recommendation Chatbot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="chat-container">
  <h1>🤖 Quick Bite Recommendation Bot</h1>
  <div id="messages" class="messages">
    <div class="bot">Hi! What would you like to eat? Try "burger", "Kerala", "Chinese", "healthy", or "best rated".</div>
  </div>
  <div class="chat-input">
    <input id="userInput" placeholder="Type your preference...">
    <button class="primary" onclick="sendMessage()">Send</button>
  </div>
</div>
<script src="chatbot.js"></script>
</body>
</html>
