<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quick Bite - Login & Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-card">
    <h1>🍴 Quick Bite</h1>
    <div class="tabs">
      <button onclick="showForm('login')">Login</button>
      <button onclick="showForm('register')">Register</button>
    </div>

    <form id="login" class="form active" onsubmit="login(event)">
      <input id="loginEmail" type="email" placeholder="Email" required>
      <input id="loginPassword" type="password" placeholder="Password" required>
      <button type="submit" class="primary">Login</button>
      <p id="loginMsg"></p>
    </form>

    <form id="register" class="form" onsubmit="register(event)">
      <input id="regName" type="text" placeholder="Full Name" required>
      <input id="regEmail" type="email" placeholder="Email" required>
      <input id="regPassword" type="password" placeholder="Password" minlength="6" required>
      <button type="submit" class="primary">Create Account</button>
      <p id="registerMsg"></p>
    </form>
  </div>
</div>
<script src="auth.js"></script>
</body>
</html>
